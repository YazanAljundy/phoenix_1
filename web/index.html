    <!-- Tajawal is now the base family for both panels (index.css's
         --font-family-base), so this is no longer warehouse-scoped.
         Weights are the identity's four tiers: 400 body, 500 buttons and
         inputs, 700 subheadings, 800 headings and prices. Tajawal ships no
         SemiBold/600 face upstream, so 600 is deliberately not requested -
         asking for it would leave the browser synthesising a fake weight. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    />
